[build]
  base = "southgold-school-portal-website"
  command = "npm run build"
  publish = ".next"

# Next.js on Netlify is served by the runtime plugin, which handles routing
# for the app router (including the [[...slug]] catch-all) and the /api/*
# routes. Paths above are relative to `base`, per Netlify's monorepo config
# rules, since the actual project (package.json, next.config.js, etc.) lives
# in the southgold-school-portal-website/ subfolder, not the repo root.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The [[...slug]] optional catch-all route matches every path, including
# files that exist in public/ (like this Google verification file), so on
# Netlify's Next.js Runtime the request gets routed to the Next.js function
# instead of the static asset. Force this exact path to be served straight
# from the CDN, bypassing the function entirely.
[[redirects]]
  from = "/googlea5a363ddc526766a.html"
  to = "/googlea5a363ddc526766a.html"
  status = 200
  force = true
